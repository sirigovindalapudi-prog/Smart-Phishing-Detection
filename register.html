<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Smart Phishing Detection</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/login.css') }}">

</head>

<body>

<div class="overlay"></div>

<div class="login-box">

    <div class="logo">🛡</div>

    <h1>Create Account</h1>

    <p>Join Smart Phishing Detection Platform</p>

    <form method="POST">

        <input type="text"
               name="name"
               placeholder="👤 Full Name"
               required>

        <input type="email"
               name="email"
               placeholder="📧 Email Address"
               required>

        <input type="password"
               name="password"
               placeholder="🔒 Password"
               required>

        <input type="password"
               name="confirm_password"
               placeholder="🔒 Confirm Password"
               required>

        <button type="submit">

            Register

        </button>

    </form>

    <div class="register">

        Already have an account?

        <a href="/">

            Login

        </a>

    </div>

</div>

</body>

</html>

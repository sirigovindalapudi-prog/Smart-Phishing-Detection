<!DOCTYPE html>
<html>

<head>

    <title>Password Strength Checker</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/scanner.css') }}">

</head>

<body>

<div class="overlay"></div>

<div class="scanner-container">

    <h1>🔐 Password Strength Checker</h1>

    <form method="POST">

        <textarea
            name="password"
            placeholder="Enter Password..."
            required></textarea>

        <button type="submit">

            Analyze Password

        </button>

    </form>

    {% if strength %}

        <div class="result">

            <h2>{{ strength }}</h2>

            <h3>{{ score }}</h3>

            <p>{{ suggestion }}</p>

        </div>

    {% endif %}

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>URL Scanner</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/scanner.css') }}">

</head>

<body>

<div class="container">

    <h1>🌐 AI URL Scanner</h1>

    <p>Analyze websites for phishing attacks.</p>

    <form method="POST">

        <input
        type="text"
        name="url"
        placeholder="https://example.com"
        required>

        <button>

            Analyze URL

        </button>

    </form>

    {% if prediction %}

    <div class="result">

        {{ prediction }}

    </div>

    {% endif %}

    <a href="/dashboard" class="back">

        ⬅ Back to Dashboard

    </a>

</div>

</body>

</html>

<!DOCTYPE html>
<html>
<head>
    <title>Voice Scam Detection</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/scanner.css') }}">
</head>

<body>

<div class="overlay"></div>

<div class="scanner-container">

<h1>🎤 Voice Scam Detection</h1>

<form method="POST" enctype="multipart/form-data">

<input type="file"
       name="audio"
       accept=".mp3,.wav,.m4a"
       required>

<br><br>

<button type="submit">

Analyze Voice

</button>

</form>

{% if prediction %}

<div class="result">

<h3>Voice Text</h3>

<p>{{ text }}</p>

<h2>{{ prediction }}</h2>

</div>

{% endif %}

</div>

</body>
</html>
